description: 'Monogram Health is a value-based, in-home specialty care provider for people living
  with chronic kidney disease, end-stage renal disease, and other complex chronic conditions.
  Multidisciplinary teams of physicians, nurse practitioners, nurses, dietitians, pharmacists, and
  social workers deliver coordinated care in patients'' homes with 24/7 access, addressing both medical
  needs and social determinants of health to reduce hospitalizations and emergency visits. Headquartered
  in Nashville, Tennessee, the company partners with health plans (payer partners) and provider groups
  and serves over 200,000 patients annually. This is a healthcare services company with no public
  developer, API, or platform surface; the enrichment pass probed domain security and found no API.'
